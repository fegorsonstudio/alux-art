<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Noto Color Emoji declares coverage of the ASCII digits, # and *, because
     they are the base characters of keycap emoji (1 + U+20E3). fontconfig then
     hands it every number in a line of text, and "N1,000" renders as
     "N 1 , 0 0 0" in wide emoji-metric glyphs while the letters come from
     DejaVu. Strip those characters from its coverage so it is used only for
     what it is installed for. -->
<fontconfig>
  <match target="scan">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <int>0x0023</int>
          <int>0x002a</int>
          <range><int>0x0030</int><int>0x0039</int></range>
        </charset>
      </minus>
    </edit>
  </match>
</fontconfig>
